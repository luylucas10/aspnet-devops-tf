name: 'Terraform CI/CD'

on:
  push:
    branches:
      - main
    paths:
      - '**.tf'
  workflow_dispatch:

# Permissões necessárias para autenticação OIDC com o Azure
permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        shell: bash

    steps:
    # 1. Faz o checkout do código do repositório
    - name: Checkout
      uses: actions/checkout@v4

    # 2. Configura o ambiente do Terraform
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    # 3. Autentica no Azure usando OIDC (método recomendado)
    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    # 4. Inicializa o Terraform
    # As credenciais do Azure são injetadas automaticamente pelo 'azure/login'
    - name: Terraform Init
      run: terraform init

    # 5. Valida a sintaxe dos arquivos Terraform
    - name: Terraform Validate
      run: terraform validate -no-color

    # 6. Gera o plano de execução do Terraform
    - name: Terraform Plan
      id: plan
      run: terraform plan -no-color -out=tfplan
      continue-on-error: true

    # 7. Aplica o plano se a etapa de plan for bem-sucedida
    - name: Terraform Apply
      if: steps.plan.outcome == 'success'
      run: terraform apply -auto-approve tfplan
